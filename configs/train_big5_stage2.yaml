# Big Five Stage2: 解冻 gate + SCL（跨 persona 对比学习）
# SCL 在 Big Five 5D 空间应能真正生效（cos 均值 0.037）

model:
  inject_layers: [16, 17, 18, 19, 20, 21, 22, 23]
  v_dim: 1024
  hidden_dim: 4096
  layer_dim: 2560
  v_norm_weight: 0.01
  v_norm_target: 32.0
  num_inject_layers: 8
  use_layer_embedding: true

base_model: /home/kemove/Desktop/PersonaSteer/Qwen/Qwen3-4B
stage1_checkpoint: checkpoints/big5_stage1/best.pt

data:
  tokenizer: /home/kemove/Desktop/PersonaSteer/Qwen/Qwen3-4B
  train_path: data/big5_cross_persona/train.jsonl
  eval_path: data/big5_cross_persona/train.jsonl
  max_turns: 1
  batch_size: 4
  num_workers: 2

training:
  stage: 2

  num_epochs: 10
  learning_rate: 0.00005
  weight_decay: 0.01
  max_grad_norm: 1.0

  sft_weight: 1.0
  scl_weight: 1.0     # Big Five 空间正交，SCL 应能生效
  temperature: 0.15

  gate_init_bias: -1.0
  gate_max: 1.0
  gate_reg_weight: 0.01

  v_norm_weight: 0.1
  v_norm_target: 5.0

  warmup_steps: 20
  use_amp: true

  output_dir: checkpoints/big5_stage2
  save_interval: 2
  log_interval: 10

  use_dual_loss: false

device: cuda:0
seed: 42
debug: false
