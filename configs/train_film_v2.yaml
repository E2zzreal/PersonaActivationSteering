# PersonaSteer v2: FiLM Injection + Prompt Dropout Curriculum
# 三阶段课程训练：Phase1(injection-only) → Phase2(50/50) → Phase3(70/30)

model:
  inject_layers: [16, 17, 18, 19, 20, 21, 22, 23]
  v_dim: 1024
  hidden_dim: 4096
  layer_dim: 2560
  num_inject_layers: 8
  use_layer_embedding: true
  injection_type: film           # 使用 FiLM 注入替代加法注入

base_model: /home/kemove/Desktop/PersonaSteer/Qwen/Qwen3-4B

data:
  tokenizer: /home/kemove/Desktop/PersonaSteer/Qwen/Qwen3-4B
  train_path: data/big5_cross_persona/train.jsonl
  eval_path: data/big5_cross_persona/train.jsonl
  max_turns: 1
  batch_size: 4
  num_workers: 2

training:
  # Phase 1: 纯注入训练（100% prompt masked → prompt_include_rate=0.0）
  phase1:
    epochs: 5
    lr: 5.0e-5
    prompt_include_rate: 0.0
    scl_weight: 0.0

  # Phase 2: 协作学习（50% prompt included）
  phase2:
    epochs: 5
    lr: 3.0e-5
    prompt_include_rate: 0.5
    scl_weight: 0.5

  # Phase 3: 面向部署微调（70% prompt included）
  phase3:
    epochs: 3
    lr: 1.0e-5
    prompt_include_rate: 0.7
    scl_weight: 0.5

  # 共通参数
  weight_decay: 0.01
  max_grad_norm: 1.0
  sft_weight: 1.0
  v_norm_weight: 0.1
  v_norm_target: 5.0
  warmup_steps: 20
  use_amp: true
  use_dual_loss: false

  output_dir: checkpoints/film_v2
  save_interval: 2
  log_interval: 10

device: cuda:0
seed: 42
debug: false
